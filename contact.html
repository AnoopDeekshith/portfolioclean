<main>
  <div class="page-enter">

      <div class="intro">
        <div class="mark" aria-hidden="true"><span>VJR<span class="accent">.</span></span></div>

          <a class="link-underline" style="color:var(--fg)" href="mailto:vaishnavirajur02@gmail.com">vaishnavirajur02@gmail.com</a>.</p>
        <div class="socials">
          <a href="https://linkedin.com/in/vaishnavijrajur" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 0 1-2.063-2.065 2.064 2.064 0 1 1 2.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg></a>
          <a href="mailto:vaishnavirajur02@gmail.com" aria-label="Email"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="1.5"/><path d="m3.5 6 8.5 7 8.5-7"/></svg></a>
        </div>
      </div>

      <form id="contact-form">
        <fieldset>
          <legend>Name</legend>
          <div class="row2">
            <label>First Name <span class="faint">(required)</span><input name="firstName" required autocomplete="given-name"></label>
            <label>Last Name <span class="faint">(required)</span><input name="lastName" required autocomplete="family-name"></label>
          </div>
        </fieldset>
        <label>Email <span class="faint">(required)</span><input type="email" name="email" required autocomplete="email"></label>
        <label>Message <span class="faint">(required)</span><textarea name="message" rows="6" required></textarea></label>
        <div style="display:flex;align-items:center;gap:1rem">
          <button type="submit" class="btn-solid">Send</button>
          <p id="form-note" class="form-note" aria-live="polite"></p>
        </div>
      </form>
    </div>
  </div>
